<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello world</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background: #050816;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #ffffff;
      overflow: hidden;
      position: relative;
    }
    .content {
      position: relative;
      z-index: 1;
      text-align: center;
    }
    .lines {
      position: absolute;
      inset: -10%;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .line {
      position: absolute;
      width: 8px;
      height: 180%;
      border-radius: 999px;
      background: linear-gradient(
        180deg,
        rgba(56, 189, 248, 0),
        rgba(56, 189, 248, 1),
        rgba(56, 189, 248, 0)
      );
      box-shadow:
        0 0 20px rgba(56, 189, 248, 0.8),
        0 0 40px rgba(59, 130, 246, 0.7),
        0 0 80px rgba(129, 140, 248, 0.6);
      filter: blur(1px);
      mix-blend-mode: screen;
      transform-origin: center;
      animation: neonBeam 10s ease-in-out infinite;
    }
    .line:nth-child(1) {
      left: 25%;
      animation-duration: 11s;
      animation-delay: -3s;
      transform: rotate(18deg);
    }
    .line:nth-child(2) {
      left: 50%;
      animation-duration: 9s;
      animation-delay: -5s;
      transform: rotate(-14deg);
      background: linear-gradient(
        180deg,
        rgba(248, 113, 113, 0),
        rgba(248, 113, 113, 1),
        rgba(248, 113, 113, 0)
      );
      box-shadow:
        0 0 20px rgba(248, 113, 113, 0.8),
        0 0 40px rgba(251, 146, 60, 0.7),
        0 0 80px rgba(251, 191, 36, 0.6);
    }
    .line:nth-child(3) {
      left: 75%;
      animation-duration: 13s;
      animation-delay: -1s;
      transform: rotate(20deg);
      background: linear-gradient(
        180deg,
        rgba(52, 211, 153, 0),
        rgba(52, 211, 153, 1),
        rgba(52, 211, 153, 0)
      );
      box-shadow:
        0 0 20px rgba(52, 211, 153, 0.8),
        0 0 40px rgba(16, 185, 129, 0.7),
        0 0 80px rgba(45, 212, 191, 0.6);
    }
    @keyframes neonBeam {
      0% {
        transform: translate3d(0, -30%, 0) scaleX(0.9) rotate(var(--rotate, 18deg));
        opacity: 0.15;
      }
      25% {
        transform: translate3d(4%, -10%, 0) scaleX(1.05) rotate(var(--rotate, 18deg));
        opacity: 0.9;
      }
      50% {
        transform: translate3d(-4%, 10%, 0) scaleX(1.1) rotate(var(--rotate, 18deg));
        opacity: 1;
      }
      75% {
        transform: translate3d(2%, 30%, 0) scaleX(1.02) rotate(var(--rotate, 18deg));
        opacity: 0.7;
      }
      100% {
        transform: translate3d(-2%, 50%, 0) scaleX(0.95) rotate(var(--rotate, 18deg));
        opacity: 0.2;
      }
    }
    h1 {
      font-size: 40px;
      margin-bottom: 16px;
    }
    #proverb {
      font-size: 20px;
    }
  </style>
</head>
<body>
  <div class="lines">
    <div class="line"></div>
    <div class="line"></div>
    <div class="line"></div>
    <div class="line"></div>
  </div>
  <div class="content">
    <h1>Welcome to here!</h1>
    <p id="proverb"></p>
  </div>
  <script>
    (function() {
      const proverbs = [
        "早起的鸟儿有虫吃",
        "一寸光阴一寸金",
        "失败是成功之母",
        "机会总是留给有准备的人",
        "读万卷书，行万里路",
        "不积跬步，无以至千里",
        "学无止境",
        "行胜于言",
        "种瓜得瓜，种豆得豆",
        "有志者事竟成"
      ];
      const now = new Date();
      const dayKey = Math.floor(Math.random() * proverbs.length);
      const index = dayKey % proverbs.length;
      const element = document.getElementById("proverb");
      if (element) {
        element.textContent = proverbs[index];
      }
    })();
  </script>
</body>
</html>
